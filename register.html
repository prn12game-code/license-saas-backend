<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account — LicenseHub</title>
<link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
<nav>
  <a href="/" class="logo">
    <div class="lm"><svg viewBox="0 0 16 16"><path d="M8 1L2 4v4c0 3.3 2.5 6.4 6 7 3.5-.6 6-3.7 6-7V4L8 1z"/></svg></div>
    LicenseHub
  </a>
</nav>
<div class="auth-wrap">
  <div class="auth-card">
    <h1 class="auth-title">Get started</h1>
    <p class="auth-sub">Create your free account. No credit card required.</p>

    <div class="alert alert-error"   id="error-msg"></div>
    <div class="alert alert-success" id="success-msg"></div>

    <!-- Referral bonus banner (hiện nếu có ?ref= trong URL) -->
    <div id="ref-banner" style="display:none;background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.2);border-radius:10px;padding:.75rem 1rem;margin-bottom:1.25rem;font-size:.875rem;color:#34d399">
      🎁 <strong>Bạn được mời!</strong> Đăng ký với mã này để nhận <strong>14 ngày Pro Trial miễn phí</strong>.
    </div>

    <form id="register-form">
      <div class="field" style="animation:fieldIn .4s .1s both">
        <label for="email">Email address</label>
        <div class="input-wrap">
          <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
          <div class="input-line"></div>
        </div>
      </div>

      <div class="field" style="animation:fieldIn .4s .18s both">
        <label for="password">Password <span style="font-weight:400;color:var(--txt3)">(min. 8 chars, include a number)</span></label>
        <div class="input-wrap">
          <input type="password" id="password" name="password" placeholder="••••••••" required minlength="8" oninput="checkStrength(this.value)">
          <div class="input-line"></div>
        </div>
        <div style="margin-top:8px;height:3px;background:var(--border);border-radius:4px;overflow:hidden">
          <div id="strength-bar" style="height:100%;width:0%;transition:width .4s,background .4s;border-radius:4px"></div>
        </div>
        <div id="strength-lbl" style="font-size:.75rem;color:var(--txt3);margin-top:4px;min-height:16px"></div>
      </div>

      <div class="field" style="animation:fieldIn .4s .26s both">
        <label for="referral">
          Referral code
          <span style="font-weight:400;color:var(--txt3);text-transform:none;letter-spacing:0"> (optional — nhập để nhận 14 ngày Pro)</span>
        </label>
        <div class="input-wrap">
          <input type="text" id="referral" name="referral_code" placeholder="ABCD-1234"
                 style="text-transform:uppercase;letter-spacing:.06em;font-family:var(--mono,'JetBrains Mono',monospace)">
          <div class="input-line"></div>
        </div>
        <div id="ref-check" style="font-size:.75rem;margin-top:4px;min-height:16px"></div>
      </div>

      <div style="animation:fieldIn .4s .34s both">
        <button type="submit" class="btn-submit" id="submit-btn">Create account</button>
      </div>
    </form>

    <div class="auth-footer" style="animation:fieldIn .4s .42s both">
      Already have an account? <a href="/login">Sign in</a>
    </div>
  </div>
</div>

<style>
@keyframes fieldIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
</style>

<script>
// Điền referral code từ URL ?ref=XXXX
const params = new URLSearchParams(location.search);
const refParam = params.get('ref');
if (refParam) {
  document.getElementById('referral').value = refParam.toUpperCase();
  document.getElementById('ref-banner').style.display = 'block';
}

function checkStrength(val) {
  const bar = document.getElementById('strength-bar');
  const lbl = document.getElementById('strength-lbl');
  if (!val) { bar.style.width = '0%'; lbl.textContent = ''; return; }
  let score = 0;
  if (val.length >= 8)  score++;
  if (val.length >= 12) score++;
  if (/\d/.test(val))   score++;
  if (/[A-Z]/.test(val)) score++;
  if (/[^a-zA-Z0-9]/.test(val)) score++;
  const L = [
    {p:'20%',c:'#f87171',t:'Too weak'},
    {p:'40%',c:'#fb923c',t:'Weak'},
    {p:'60%',c:'#fbbf24',t:'Fair'},
    {p:'80%',c:'#34d399',t:'Strong'},
    {p:'100%',c:'#22d3ee',t:'Very strong'},
  ];
  const l = L[Math.min(score-1,4)]||L[0];
  bar.style.width=l.p; bar.style.background=l.c;
  lbl.style.color=l.c; lbl.textContent=l.t;
}

// Kiểm tra referral code realtime
let refTimer;
document.getElementById('referral').addEventListener('input', function() {
  clearTimeout(refTimer);
  const val = this.value.toUpperCase().trim();
  const el = document.getElementById('ref-check');
  if (!val) { el.textContent = ''; return; }
  if (val.length < 6) { el.style.color='var(--txt3)'; el.textContent = 'Đang nhập…'; return; }
  refTimer = setTimeout(async () => {
    try {
      const r = await fetch('/api/referral/validate?code=' + encodeURIComponent(val));
      if (r.ok) {
        el.style.color = '#34d399';
        el.textContent = '✓ Mã hợp lệ — bạn sẽ nhận 14 ngày Pro Trial!';
        document.getElementById('ref-banner').style.display = 'block';
      } else {
        el.style.color = 'var(--err, #f87171)';
        el.textContent = '✗ Mã không tồn tại.';
      }
    } catch {}
  }, 600);
});

// Ripple
document.getElementById('submit-btn').addEventListener('click', function(e) {
  const r = document.createElement('span'); r.className = 'ripple';
  const rect = this.getBoundingClientRect(), size = Math.max(rect.width, rect.height);
  r.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px`;
  this.appendChild(r); setTimeout(() => r.remove(), 700);
});

document.getElementById('register-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const err = document.getElementById('error-msg');
  const ok  = document.getElementById('success-msg');
  err.classList.remove('show'); ok.classList.remove('show');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-dot"></span><span class="spinner-dot"></span><span class="spinner-dot"></span>';

  try {
    const res  = await fetch('/api/register-with-referral', { method: 'POST', body: new FormData(e.target) });
    const data = await res.json();
    if (!res.ok) {
      err.textContent = data.detail || 'Something went wrong.';
      err.classList.add('show'); btn.disabled = false; btn.textContent = 'Create account';
      return;
    }
    const bonus = data.referral_bonus ? ' 🎁 14 ngày Pro Trial đã được kích hoạt!' : '';
    ok.textContent = 'Account created! Check your email to verify.' + bonus;
    ok.classList.add('show');
    e.target.reset();
    document.getElementById('strength-bar').style.width = '0%';
    btn.textContent = '✓ Check your email';
    btn.style.background = 'linear-gradient(135deg,#059669,#10b981)';
  } catch {
    err.textContent = 'Network error — please try again.';
    err.classList.add('show'); btn.disabled = false; btn.textContent = 'Create account';
  }
});
</script>
</body>
</html>
