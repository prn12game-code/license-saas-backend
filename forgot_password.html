<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — LicenseHub</title>
<link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>

<nav>
  <a href="/" class="logo">
    <div class="lm"><svg viewBox="0 0 16 16"><path d="M8 1L2 4v4c0 3.3 2.5 6.4 6 7 3.5-.6 6-3.7 6-7V4L8 1z"/></svg></div>
    LicenseHub
  </a>
</nav>

<div class="auth-wrap">
  <div class="auth-card">

    <!-- Icon -->
    <div style="width:52px;height:52px;background:var(--blue-dim);border:1px solid rgba(59,130,246,0.25);border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:1.25rem;animation:cardIn .5s both">
      <svg width="22" height="22" fill="none" stroke="var(--blue-h)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
        <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>
      </svg>
    </div>

    <h1 class="auth-title">Reset password</h1>
    <p class="auth-sub">Enter your email and we'll send you a secure reset link.</p>

    <div class="alert alert-error"   id="error-msg"></div>
    <div class="alert alert-success" id="success-msg"></div>

    <form id="forgot-form">
      <div class="field" style="animation:fieldIn .4s .1s both">
        <label for="email">Email address</label>
        <div class="input-wrap">
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
          <div class="input-line"></div>
        </div>
      </div>
      <div style="animation:fieldIn .4s .2s both">
        <button type="submit" class="btn-submit" id="submit-btn">Send reset link</button>
      </div>
    </form>

    <div class="auth-footer" style="animation:fieldIn .4s .3s both">
      <a href="/login">← Back to sign in</a>
    </div>
  </div>
</div>

<style>
@keyframes fieldIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
</style>

<script>
document.getElementById('submit-btn').addEventListener('click', function(e) {
  const r = document.createElement('span'); r.className = 'ripple';
  const rect = this.getBoundingClientRect(), size = Math.max(rect.width, rect.height);
  r.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px`;
  this.appendChild(r); setTimeout(() => r.remove(), 700);
});

document.getElementById('forgot-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const err = document.getElementById('error-msg');
  const ok  = document.getElementById('success-msg');
  err.classList.remove('show'); ok.classList.remove('show');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-dot"></span><span class="spinner-dot"></span><span class="spinner-dot"></span>';

  try {
    const res  = await fetch('/api/forgot-password', { method: 'POST', body: new FormData(e.target) });
    const data = await res.json();
    ok.textContent = data.msg || 'If that email exists, a reset link has been sent.';
    ok.classList.add('show');
    btn.textContent = '✓ Email sent';
    btn.style.background = 'linear-gradient(135deg, #059669, #10b981)';
  } catch {
    err.textContent = 'Network error — please try again.';
    err.classList.add('show');
    btn.disabled = false; btn.textContent = 'Send reset link';
  }
});
</script>
</body>
</html>
